<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202020"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Workout Timer">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Workout Timer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#202020;color:white;font-family:Arial;padding-bottom:env(safe-area-inset-bottom)}button{cursor:pointer;touch-action:manipulation}.cond{font-family:Impact,'Arial Narrow',sans-serif;letter-spacing:-1px}.top{height:70px;display:grid;place-items:center;background:#242424}.yellow{color:#ffff27}.phase{height:38vh;min-height:260px;max-height:390px;background:#ffff27;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}.phase.work{background:#8cff38}.phase.rest{background:#f33b30}.phase.cool{background:#39afe9}.pname{font:clamp(42px,12vw,60px) Impact}.big{font:clamp(110px,29vw,190px) Impact;line-height:1;font-variant-numeric:tabular-nums}.sub{height:105px;background:#8cff38;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}.sub strong{font:70px Impact}.sub span{font:27px Impact}.count{display:flex;align-items:center;justify-content:space-around;padding:15px 5px}.count strong{font:58px Impact;color:#39afe9}.play{width:88px;height:88px;border-radius:50%;background:#ffff27;color:#000;border:5px solid #ffff27;font-size:38px}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 8px 12px}.secondary{background:#383838;color:white;border:1px solid #666;border-radius:10px;padding:11px}.nav{display:grid;grid-template-columns:repeat(4,1fr);position:sticky;bottom:0;background:#191919;padding:10px 2px max(10px,env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#ddd;padding:9px 1px;font:14px Impact;border-radius:25px}.nav button.active{background:#080808;color:#ffff27}.screen{display:none}.screen.active{display:block}.editor{padding:14px 16px}.field{border-bottom:1px solid #444;padding:13px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}.desc{color:#aaa;font-size:12px;margin-top:4px}.adjust{display:flex;gap:5px;align-items:center}.adjust button{width:35px;height:39px;background:#383838;border:1px solid #666;color:white;border-radius:7px;font-size:22px}.adjust input{width:62px;background:#303030;border:1px solid #999;border-radius:7px;color:white;text-align:center;padding:9px 2px;font-size:18px}.totalbox{background:#303030;border-radius:12px;padding:15px;margin:16px 0;display:flex;justify-content:space-between;align-items:center}.action{width:100%;padding:16px;border:0;border-radius:12px;background:#ffff27;color:#000;font-weight:900;margin:7px 0}.notice{color:#bbb;font-size:12px;text-align:center;padding:10px}.chrono{text-align:center;padding:40px 5px}.chrono strong{display:block;color:white;font:clamp(72px,20vw,110px) Impact}.title{font:30px Impact;margin:15px 0}
</style></head><body>
<header class="top"><div style="text-align:center"><div class="cond yellow" id="mode">ROUND</div><div class="cond" id="total">03:20</div></div></header>
<section id="timer" class="screen active"><div id="phase" class="phase"><div class="pname" id="phase-name">PREPARA</div><div class="big" id="clock">00:05</div></div>
<div id="next" class="sub"><span id="next-name">LAVORA</span><strong id="next-clock">00:30</strong></div>
<div class="count"><div><strong id="left">4</strong><div class="cond">ROUND RIMASTI</div></div><button class="play" id="toggle">▶</button><div class="cond yellow" id="status">AVVIA</div></div>
<div class="controls"><button class="secondary" id="skip">AVANTI ⏭</button><button class="secondary" id="edit">MODIFICA TIMER</button><button class="secondary" id="reset">↺ RESET</button></div></section>
<section id="editor" class="screen"><div class="editor"><div class="title">CONFIGURA <span class="yellow" id="edit-mode">ROUND</span></div><div id="fields"></div>
<div class="totalbox"><b>DURATA TOTALE<br><small style="color:#aaa">Inclusi tutti i recuperi</small></b><strong class="cond yellow" id="preview" style="font-size:32px">03:20</strong></div>
<button class="action" id="save">SALVA CONFIGURAZIONE</button><button class="secondary" id="defaults">RIPRISTINA VALORI</button><p class="notice">I valori ROUND e TABATA sono indipendenti.</p></div></section>
<section id="chrono" class="screen"><div class="title" style="text-align:center">CRONOMETRO</div><div class="chrono"><strong id="chrono-value">00:00.0</strong><div class="controls"><button class="play" id="chrono-toggle">▶</button><button class="secondary" id="chrono-reset">RESET</button></div></div></section>
<section id="other" class="screen"><div class="editor"><div class="title">IMPOSTAZIONI</div><div class="field"><b>Suoni attivi</b><input type="checkbox" id="sound" checked></div><div class="field"><b>Vibrazione</b><input type="checkbox" id="vibrate" checked></div><div class="field"><b>Volume</b><input type="range" id="volume" min="0" max="100" value="65"></div><div class="title">TIMER SALVATI</div><div id="saved"></div><button class="action" id="save-preset">SALVA TIMER ATTUALE</button></div></section>
<nav class="nav"><button data-page="tabata">◴<br>TABATA</button><button data-page="round" class="active">◉<br>ROUND</button><button data-page="chrono">●<br>CRONOMETRO</button><button data-page="other">◯<br>ALTRO</button></nav>
<script>
const $=id=>document.getElementById(id),R={prep:5,work:30,rest:15,rounds:4,cool:0,sets:1,setRest:60},T={prep:5,work:20,rest:10,rounds:8,cool:0,sets:1,setRest:60};
let configs={round:{...R},tabata:{...T}},mode='round',cfg=configs.round,steps=[],idx=0,remaining=0,running=false,interval=null,deadline=0,audio=null,sound=true,vibrate=true,volume=.65,presets=[];
const defs=[['prep','PREPARA','Preparazione iniziale',0,3600],['work','LAVORA','Durata lavoro',1,3600],['rest','RIPOSA','Durata recupero',0,3600],['rounds','ROUND / CICLI','Numero di ripetizioni',1,99],['cool','RINFRESCATI','Recupero finale',0,3600],['sets','NUMERO DI SERIE','Serie Tabata',1,99],['setRest','RECUPERO TRA SERIE','Pausa tra serie',0,3600]];
const fmt=n=>{n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')},calc=()=>cfg.prep+cfg.sets*cfg.rounds*(cfg.work+cfg.rest)+Math.max(0,cfg.sets-1)*cfg.setRest+cfg.cool;
function build(){let a=[];if(cfg.prep)a.push({name:'PREPARA',type:'prep',duration:cfg.prep});for(let s=1;s<=cfg.sets;s++){for(let r=1;r<=cfg.rounds;r++){a.push({name:'LAVORA',type:'work',duration:cfg.work,round:r,set:s});if(cfg.rest)a.push({name:'RIPOSA',type:'rest',duration:cfg.rest,round:r,set:s})}if(s<cfg.sets&&cfg.setRest)a.push({name:'RINFRESCATI',type:'cool',duration:cfg.setRest,set:s})}if(cfg.cool)a.push({name:'RINFRESCATI',type:'cool',duration:cfg.cool});return a}
function updateTotal(){let x=fmt(calc());$('preview').textContent=x;$('total').textContent=x}
function renderFields(){$('fields').innerHTML=defs.filter(d=>mode==='tabata'||!['sets','setRest'].includes(d[0])).map(d=>`<div class="field"><div><b>${d[1]}</b><div class="desc">${d[2]}</div></div><div class="adjust"><button data-key="${d[0]}" data-delta="-1">−</button><input type="number" min="${d[3]}" max="${d[4]}" data-value="${d[0]}" value="${cfg[d[0]]}"><button data-key="${d[0]}" data-delta="1">+</button></div></div>`).join('');updateTotal()}
function clamp(k,v){let d=defs.find(x=>x[0]===k);return Math.max(d[3],Math.min(d[4],Math.round(Number(v)||0)))}
function read(){document.querySelectorAll('#fields [data-value]').forEach(e=>{cfg[e.dataset.value]=clamp(e.dataset.value,e.value);e.value=cfg[e.dataset.value]});configs[mode]={...cfg};updateTotal();localStorage.setItem('wt-configs',JSON.stringify(configs))}
$('fields').addEventListener('click',e=>{let b=e.target.closest('[data-key]');if(!b)return;read();let k=b.dataset.key;cfg[k]=clamp(k,cfg[k]+ +b.dataset.delta);configs[mode]={...cfg};$('fields').querySelector(`[data-value="${k}"]`).value=cfg[k];updateTotal()});
$('fields').addEventListener('input',e=>{if(e.target.dataset.value){let k=e.target.dataset.value;cfg[k]=clamp(k,e.target.value);configs[mode]={...cfg};updateTotal()}});
$('fields').addEventListener('change',e=>{if(e.target.dataset.value){let k=e.target.dataset.value;cfg[k]=clamp(k,e.target.value);e.target.value=cfg[k];configs[mode]={...cfg};updateTotal()}});
function audioCtx(){let C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!audio)audio=new C();if(audio.state==='suspended')audio.resume();return audio}
const tones={prep:[660],work:[880,1100],rest:[520],cool:[440,660],done:[880,1100,880]};
function beep(type){if(sound){let c=audioCtx();if(c){let seq=tones[type]||tones.prep,t=c.currentTime+.02;seq.forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain(),at=t+i*.17;o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(Math.max(.001,volume*.2),at+.02);g.gain.exponentialRampToValueAtTime(.0001,at+.14);o.start(at);o.stop(at+.15)})}}if(vibrate&&navigator.vibrate)navigator.vibrate(type==='done'?[180,80,180]:100)}
function draw(){let s=steps[idx];if(!s){$('phase-name').textContent='COMPLETATO';$('clock').textContent='00:00';$('phase').className='phase cool';$('next-name').textContent='FINE ALLENAMENTO';$('next-clock').textContent='00:00';$('left').textContent='0';$('status').textContent='COMPLETATO';$('toggle').textContent='▶';$('total').textContent='00:00';return}
$('phase-name').textContent=s.name;$('clock').textContent=fmt(remaining);$('phase').className='phase '+s.type;let n=steps[idx+1];$('next-name').textContent=n?n.name:'FINE ALLENAMENTO';$('next-clock').textContent=n?fmt(n.duration):'00:00';$('next').style.background=n?(n.type==='rest'?'#f33b30':n.type==='cool'?'#39afe9':'#8cff38'):'#39afe9';$('left').textContent=mode==='tabata'?cfg.sets-(s.set||1):cfg.rounds-(s.round||0)+(s.type==='work'?1:0);$('total').textContent=fmt(steps.slice(idx).reduce((a,x,i)=>a+(i?x.duration:remaining),0));$('toggle').textContent=running?'Ⅱ':'▶';$('status').textContent=running?'PAUSA':'AVVIA'}
function pause(){if(running){remaining=Math.max(0,(deadline-Date.now())/1000);running=false;clearInterval(interval);draw()}}
function reset(){pause();steps=build();idx=0;remaining=steps[0]?.duration||0;draw()}
function finish(){running=false;clearInterval(interval);beep('done');draw()}
function tick(){if(!running)return;let old=Math.ceil(remaining);remaining=Math.max(0,(deadline-Date.now())/1000);if(Math.ceil(remaining)<old)draw();if(remaining<=0){idx++;if(idx>=steps.length){finish();return}remaining=steps[idx].duration;deadline=Date.now()+remaining*1000;beep(steps[idx].type);draw()}}
function start(){if(idx>=steps.length)reset();if(!steps.length)return;if(!running){audioCtx();running=true;deadline=Date.now()+remaining*1000;beep(steps[idx].type);interval=setInterval(tick,100);draw()}}
function show(p){pause();['timer','editor','chrono','other'].forEach(x=>$(x).classList.remove('active'));$(p).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p))}
function changeMode(m){pause();configs[mode]={...cfg};mode=m;cfg=configs[m];$('mode').textContent=m.toUpperCase();$('edit-mode').textContent=m.toUpperCase();reset();renderFields();show('timer')}
$('toggle').onclick=()=>running?pause():start();$('reset').onclick=reset;$('skip').onclick=()=>{if(idx<steps.length-1){idx++;remaining=steps[idx].duration;if(running)deadline=Date.now()+remaining*1000;beep(steps[idx].type);draw()}else finish()};
$('edit').onclick=()=>{pause();renderFields();$('edit-mode').textContent=mode.toUpperCase();show('editor')};$('save').onclick=()=>{read();reset();show('timer')};
$('defaults').onclick=()=>{cfg=mode==='round'?{...R}:{...T};configs[mode]={...cfg};renderFields()};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>['round','tabata'].includes(b.dataset.page)?changeMode(b.dataset.page):show(b.dataset.page));
$('sound').onchange=e=>sound=e.target.checked;$('vibrate').onchange=e=>vibrate=e.target.checked;$('volume').oninput=e=>volume=e.target.value/100;
$('save-preset').onclick=()=>{presets.push({cfg:{...cfg},mode});$('saved').innerHTML=presets.map((p,i)=>`<div class="field">${p.mode.toUpperCase()} · ${p.cfg.rounds} cicli · ${p.cfg.work}s/${p.cfg.rest}s <button data-load="${i}" class="secondary">CARICA</button></div>`).join('')};
$('saved').onclick=e=>{let i=e.target.dataset.load;if(i===undefined)return;mode=presets[+i].mode;configs[mode]={...presets[+i].cfg};cfg=configs[mode];$('mode').textContent=mode.toUpperCase();reset();renderFields();show('timer')};
let cr=0,crStart=0,crRun=false,crInt;function crDraw(){let t=cr+(crRun?Date.now()-crStart:0);$('chrono-value').textContent=fmt(Math.floor(t/1000))+'.'+Math.floor(t/100)%10}
$('chrono-toggle').onclick=()=>{if(crRun){cr+=Date.now()-crStart;crRun=false;clearInterval(crInt);$('chrono-toggle').textContent='▶'}else{crStart=Date.now();crRun=true;crInt=setInterval(crDraw,80);$('chrono-toggle').textContent='Ⅱ'}crDraw()};
$('chrono-reset').onclick=()=>{cr=0;crRun=false;clearInterval(crInt);$('chrono-toggle').textContent='▶';crDraw()};
try{let v=JSON.parse(localStorage.getItem('wt-configs'));if(v?.round&&v?.tabata)configs=v;cfg=configs[mode]}catch(e){}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
steps=build();remaining=steps[0].duration;renderFields();draw();
</script></body></html>
